name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  quality:
    name: quality
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install pinned direct dependencies
        run: python -m pip install -e ".[dev]"
      - name: Lint and format check
        run: |
          ruff check .
          ruff format --diff . || true
          ruff format --check .
      - name: Strict type checking
        run: mypy src/mlp
      - name: Unit tests and coverage
        run: python -m pytest -m "not slow and not gpu"
      - name: CPU smoke test
        run: python -m mlp doctor --json
      - name: Dependency audit
        run: |
          python -m pip list --format=freeze --exclude-editable > audit-installed.txt
          pip-audit --strict --no-deps -r audit-installed.txt

  secrets:
    name: secret scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

# Docker checks are introduced with the Dockerfile in M3/M7.
