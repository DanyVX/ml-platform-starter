[build-system]
requires = ["setuptools==83.0.0"]
build-backend = "setuptools.build_meta"

[project]
name = "ml-platform-starter"
version = "0.0.0"
description = "CPU-first, single-node MLOps reference platform"
requires-python = ">=3.11,<3.14"
dependencies = [
  "pydantic-settings==2.14.2",
  "numpy==2.3.5",
  "pandas==2.3.3",
  "scikit-learn==1.8.0",
  "pandera[pandas]==0.34.1",
  "mlflow==3.17.0",
  "fastapi==0.120.4",
  "uvicorn==0.38.0",
  "prometheus-client==0.23.1",
  "httpx==0.28.1",
]

[project.optional-dependencies]
dev = [
  "ruff==0.12.11",
  "mypy==1.17.1",
  "pytest==9.0.3",
  "pytest-cov==6.2.1",
  "pre-commit==4.3.0",
  "pip-audit==2.9.0",
]

[project.scripts]
mlp = "mlp.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
target-version = "py311"
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "B", "UP"]

[tool.mypy]
python_version = "3.11"
strict = true
files = ["src/mlp"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers --cov=mlp --cov-branch --cov-report=term-missing --cov-fail-under=85"
markers = [
  "slow: opt-in slow integration tests",
  "gpu: opt-in GPU tests",
]

[[tool.mypy.overrides]]
module = ["numpy.*", "pandas.*", "sklearn.*", "pandera.*", "mlflow.*"]
ignore_missing_imports = true
